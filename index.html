<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Bilangan Bulat - Kelas 7 SMP</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #7EC8E3;
  --blue-dark: #4BA3C3;
  --blue-light: #D6F0FA;
  --yellow: #FFF9C4;
  --yellow-dark: #F9D835;
  --peach: #FFD6B8;
  --peach-dark: #FFAA77;
  --white: #FFFFFF;
  --text: #3A3A5C;
  --correct: #6DD47E;
  --wrong: #FF7B7B;
  --shadow: rgba(78,120,180,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #D6F0FA 0%, #FFF9C4 55%, #FFD6B8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.blob {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
.blob1 {
  width: 320px; height: 320px;
  top: -100px; left: -100px;
  background: radial-gradient(circle, rgba(126,200,227,0.35) 0%, transparent 70%);
  animation: floatBlob 9s ease-in-out infinite;
}
.blob2 {
  width: 280px; height: 280px;
  bottom: -80px; right: -80px;
  background: radial-gradient(circle, rgba(255,170,119,0.3) 0%, transparent 70%);
  animation: floatBlob 11s ease-in-out infinite reverse;
}
.blob3 {
  width: 200px; height: 200px;
  top: 40%; right: -60px;
  background: radial-gradient(circle, rgba(249,216,53,0.28) 0%, transparent 70%);
  animation: floatBlob 7s ease-in-out infinite 2s;
}
@keyframes floatBlob {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(28px) scale(1.07); }
}

.stars { position: fixed; top:0; left:0; right:0; bottom:0; pointer-events:none; z-index:0; overflow:hidden; }
.star { position:absolute; opacity:0.18; animation:twinkle 3s ease-in-out infinite; }
@keyframes twinkle {
  0%,100% { opacity:0.12; transform:scale(1); }
  50% { opacity:0.35; transform:scale(1.35); }
}

/* ── WATERMARK ── */
.watermark {
  position: fixed;
  bottom: 14px;
  right: 18px;
  font-family: 'Fredoka One', cursive;
  font-size: 15px;
  color: rgba(75,163,195,0.65);
  letter-spacing: 1px;
  pointer-events: none;
  z-index: 9999;
  user-select: none;
  text-shadow: 0 1px 4px rgba(255,255,255,0.8);
}

/* ── PAGES ── */
.page {
  display: none;
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 560px;
  padding: 16px;
}
.page.active {
  display: block;
  animation: pageIn 0.55s cubic-bezier(.22,.68,0,1.2) forwards;
}
.page.exit {
  display: block;
  animation: pageOut 0.35s ease forwards;
}
@keyframes pageIn {
  from { opacity:0; transform:translateY(48px) scale(0.95); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}
@keyframes pageOut {
  from { opacity:1; transform:translateY(0) scale(1); }
  to   { opacity:0; transform:translateY(-32px) scale(0.97); }
}

/* ── CARD ── */
.card {
  background: rgba(255,255,255,0.87);
  backdrop-filter: blur(14px);
  border-radius: 28px;
  box-shadow: 0 10px 50px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.9);
  padding: 36px 32px 30px;
  position: relative;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.95);
}
.card-stripe {
  position: absolute;
  top:0; left:0; right:0;
  height: 7px;
  background: linear-gradient(90deg, var(--blue-dark), var(--yellow-dark), var(--peach-dark), var(--blue-dark));
  background-size: 200% 100%;
  animation: stripeScroll 3.5s linear infinite;
  border-radius: 28px 28px 0 0;
}
@keyframes stripeScroll {
  0% { background-position: 0% 0%; }
  100% { background-position: 200% 0%; }
}

/* ── START PAGE ── */
.start-mascot {
  font-size: 74px;
  text-align: center;
  display: block;
  margin-bottom: 6px;
  animation: mascotBounce 1.8s ease-in-out infinite;
  filter: drop-shadow(0 8px 14px rgba(78,163,195,0.22));
}
@keyframes mascotBounce {
  0%,100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-16px) rotate(4deg); }
}
.start-title {
  font-family: 'Fredoka One', cursive;
  font-size: 2.1rem;
  color: var(--blue-dark);
  text-align: center;
  line-height: 1.2;
  margin-bottom: 5px;
  text-shadow: 2px 3px 0 rgba(126,200,227,0.22);
}
.start-badge {
  display: block;
  width: fit-content;
  margin: 0 auto 20px;
  background: linear-gradient(135deg, var(--yellow), var(--peach));
  color: var(--text);
  font-weight: 900;
  font-size: 0.8rem;
  padding: 4px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--yellow-dark);
  letter-spacing: 0.5px;
}
.start-info {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
}
.info-chip {
  flex: 1;
  background: var(--blue-light);
  border-radius: 14px;
  padding: 10px 6px;
  text-align: center;
  font-weight: 800;
  font-size: 0.8rem;
  color: var(--blue-dark);
  border: 1.5px solid var(--blue);
}
.info-chip span { display:block; font-size:1.4rem; margin-bottom:3px; }

.input-label {
  display: block;
  font-weight: 900;
  font-size: 0.9rem;
  color: var(--text);
  margin-bottom: 8px;
  padding-left: 4px;
}
.name-input {
  width: 100%;
  padding: 14px 18px;
  border: 2.5px solid var(--blue);
  border-radius: 16px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
  background: var(--blue-light);
  outline: none;
  transition: all 0.22s;
  margin-bottom: 20px;
}
.name-input:focus {
  border-color: var(--blue-dark);
  background: white;
  box-shadow: 0 0 0 4px rgba(126,200,227,0.25);
}
.name-input::placeholder { color: #aac8d8; }

/* ── BUTTONS ── */
.btn {
  display: block;
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 18px;
  font-family: 'Fredoka One', cursive;
  font-size: 1.18rem;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
  letter-spacing: 0.5px;
}
.btn:hover { transform: translateY(-3px); filter: brightness(1.06); }
.btn:active { transform: translateY(0); }

.btn-start {
  background: linear-gradient(135deg, #4BA3C3, #7EC8E3);
  color: white;
  box-shadow: 0 6px 24px rgba(75,163,195,0.45);
}
.btn-next {
  background: linear-gradient(135deg, var(--peach-dark), #FF8C55);
  color: white;
  box-shadow: 0 6px 20px rgba(255,140,85,0.4);
  margin-top: 14px;
  display: none;
}
.btn-restart {
  background: linear-gradient(135deg, var(--yellow-dark), #e0c000);
  color: var(--text);
  box-shadow: 0 6px 20px rgba(220,190,0,0.35);
  margin-top: 10px;
}

/* ── QUIZ TOP ── */
.quiz-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.q-counter {
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  color: var(--blue-dark);
  background: var(--blue-light);
  padding: 6px 16px;
  border-radius: 30px;
  border: 1.5px solid var(--blue);
}
.score-chip {
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  color: white;
  background: linear-gradient(135deg, var(--peach-dark), #FF8C55);
  padding: 6px 16px;
  border-radius: 30px;
  box-shadow: 0 3px 10px rgba(255,140,85,0.35);
}

.progress-wrap {
  background: var(--blue-light);
  border-radius: 10px;
  height: 10px;
  overflow: hidden;
  margin-bottom: 16px;
  border: 1px solid rgba(126,200,227,0.4);
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue-dark), var(--blue));
  border-radius: 10px;
  transition: width 0.6s cubic-bezier(.22,.68,0,1.2);
}

/* Timer */
.timer-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.timer-icon { font-size: 1rem; }
.timer-track { flex:1; background:#eee; border-radius:8px; height:8px; overflow:hidden; }
.timer-fill {
  height: 100%;
  border-radius: 8px;
  transition: width 1s linear, background 0.5s;
}
.timer-count {
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  color: var(--blue-dark);
  min-width: 32px;
  text-align: right;
}

/* Reading indicator */
.reading-box {
  display: none;
  align-items: center;
  gap: 7px;
  background: var(--blue-light);
  border: 1.5px solid var(--blue);
  border-radius: 20px;
  padding: 6px 14px;
  margin-bottom: 10px;
  width: fit-content;
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--blue-dark);
}
.reading-box.show { display: flex; }
.rdot {
  width: 7px; height: 7px;
  background: var(--blue-dark);
  border-radius: 50%;
  animation: rdotBlink 0.7s ease-in-out infinite;
}
.rdot:nth-child(2) { animation-delay: 0.22s; }
.rdot:nth-child(3) { animation-delay: 0.44s; }
@keyframes rdotBlink {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.2; transform:scale(0.6); }
}

/* Question */
.q-text {
  font-family: 'Fredoka One', cursive;
  font-size: 1.18rem;
  color: var(--text);
  background: linear-gradient(135deg, var(--yellow) 60%, var(--peach));
  padding: 20px 20px 16px;
  border-radius: 18px;
  margin-bottom: 18px;
  line-height: 1.55;
  border: 2px dashed var(--yellow-dark);
  position: relative;
}
.q-num-tag {
  position: absolute;
  top: -12px; left: 16px;
  background: var(--yellow-dark);
  color: var(--text);
  font-size: 0.75rem;
  font-family: 'Fredoka One', cursive;
  padding: 2px 12px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* Options */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.opt-btn {
  padding: 14px 10px;
  border: 2.5px solid var(--blue);
  border-radius: 16px;
  background: white;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.97rem;
  color: var(--text);
  cursor: pointer;
  transition: all 0.18s;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.opt-btn::before {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(135deg, var(--blue-light), var(--peach));
  opacity:0; transition:opacity 0.2s;
}
.opt-btn span { position:relative; z-index:1; }
.opt-btn:hover:not(:disabled)::before { opacity:1; }
.opt-btn:hover:not(:disabled) {
  border-color: var(--blue-dark);
  transform: translateY(-3px);
  box-shadow: 0 5px 16px rgba(78,163,195,0.25);
}
.opt-btn.correct {
  background: var(--correct) !important;
  border-color: #3cb85a !important;
  color: white !important;
  animation: popIn 0.35s ease;
}
.opt-btn.wrong {
  background: var(--wrong) !important;
  border-color: #e05555 !important;
  color: white !important;
  animation: shakeIt 0.4s ease;
}
.opt-btn:disabled { cursor: default; }

@keyframes popIn {
  0% { transform:scale(1); }
  40% { transform:scale(1.09); }
  100% { transform:scale(1); }
}
@keyframes shakeIt {
  0%,100% { transform:translateX(0); }
  25% { transform:translateX(-7px); }
  75% { transform:translateX(7px); }
}

.feedback {
  min-height: 38px;
  text-align: center;
  font-weight: 900;
  font-size: 0.97rem;
  padding: 8px 16px;
  border-radius: 14px;
  transition: all 0.3s;
  margin-bottom: 2px;
}
.feedback.correct { background:rgba(109,212,126,0.2); color:#2a9a3e; }
.feedback.wrong { background:rgba(255,123,123,0.15); color:#c93535; }

/* ── RESULT PAGE ── */
.result-trophy {
  font-size: 74px;
  text-align: center;
  display: block;
  animation: trophyPop 0.7s cubic-bezier(.22,.68,0,1.4) forwards;
  filter: drop-shadow(0 8px 18px rgba(249,216,53,0.5));
}
@keyframes trophyPop {
  0% { transform:scale(0) rotate(-20deg); }
  70% { transform:scale(1.18) rotate(5deg); }
  100% { transform:scale(1) rotate(0deg); }
}

.result-name-display {
  text-align: center;
  font-family: 'Fredoka One', cursive;
  font-size: 1.5rem;
  color: var(--blue-dark);
  margin: 10px 0 4px;
}
.result-score-big {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 16px 0 14px;
}
.score-circle {
  width: 112px; height: 112px;
  background: linear-gradient(135deg, #4BA3C3, #7EC8E3);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 30px rgba(75,163,195,0.45);
  border: 4px solid white;
  animation: circlePopIn 0.6s 0.25s cubic-bezier(.22,.68,0,1.3) both;
}
@keyframes circlePopIn {
  from { transform:scale(0); opacity:0; }
  to { transform:scale(1); opacity:1; }
}
.score-number {
  font-family: 'Fredoka One', cursive;
  font-size: 2.3rem;
  color: white;
  line-height: 1;
}
.score-sublabel { font-size:0.75rem; color:rgba(255,255,255,0.85); font-weight:700; }
.score-slash { font-family:'Fredoka One',cursive; font-size:2rem; color:var(--blue-dark); }
.score-of { font-family:'Fredoka One',cursive; font-size:1.5rem; color:var(--text); opacity:0.4; }

.result-detail-card {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.detail-chip {
  background: var(--blue-light);
  border-radius: 14px;
  padding: 12px 8px;
  text-align: center;
  border: 1.5px solid var(--blue);
}
.detail-chip.cc { background:rgba(109,212,126,0.18); border-color:var(--correct); }
.detail-chip.wc { background:rgba(255,123,123,0.14); border-color:var(--wrong); }
.detail-val {
  font-family: 'Fredoka One', cursive;
  font-size: 1.6rem;
  display: block;
  color: var(--text);
}
.detail-lbl { font-size:0.7rem; font-weight:800; color:#999; }

.motivation-box {
  background: linear-gradient(135deg, var(--yellow), var(--peach));
  border-radius: 18px;
  padding: 16px 20px;
  text-align: center;
  font-weight: 800;
  font-size: 0.97rem;
  color: var(--text);
  border: 2px dashed var(--yellow-dark);
  margin-bottom: 16px;
  line-height: 1.55;
}

#confettiCanvas {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events: none;
  z-index: 9998;
}

@media (max-width: 480px) {
  .card { padding:28px 16px 22px; }
  .start-title { font-size:1.65rem; }
  .options-grid { grid-template-columns:1fr; }
  .score-circle { width:90px; height:90px; }
  .score-number { font-size:1.8rem; }
  .result-detail-card { gap:8px; }
}
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="stars" id="stars"></div>
<canvas id="confettiCanvas"></canvas>

<!-- ★ WATERMARK ★ -->
<div class="watermark">✏️ Siti Sundari</div>

<!-- ===== PAGE 1: START ===== -->
<div class="page active" id="pageStart">
  <div class="card">
    <div class="card-stripe"></div>
    <span class="start-mascot">🔢</span>
    <h1 class="start-title">Kuis Bilangan Bulat</h1>
    <span class="start-badge">📐 Matematika · Kelas 7 SMP</span>
    <div class="start-info">
      <div class="info-chip"><span>📝</span>10 Soal</div>
      <div class="info-chip"><span>⏱️</span>20 Detik</div>
      <div class="info-chip"><span>🎯</span>Pilihan Ganda</div>
    </div>
    <label class="input-label" for="studentName">👤 Nama Lengkap Kamu:</label>
    <input type="text" id="studentName" class="name-input" placeholder="Ketik nama kamu di sini..." maxlength="40" />
    <button class="btn btn-start" onclick="startQuiz()">🚀 Mulai Kuis!</button>
  </div>
</div>

<!-- ===== PAGE 2: QUIZ ===== -->
<div class="page" id="pageQuiz">
  <div class="card">
    <div class="card-stripe"></div>
    <div class="quiz-top">
      <div class="q-counter" id="qCounter">Soal 1 / 10</div>
      <div class="score-chip" id="scoreChip">⭐ 0</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="timer-row">
      <span class="timer-icon">⏱️</span>
      <div class="timer-track">
        <div class="timer-fill" id="timerFill" style="width:100%;background:#6DD47E;"></div>
      </div>
      <span class="timer-count" id="timerCount">20</span>
    </div>
    <div class="reading-box" id="readingBox">
      <div class="rdot"></div><div class="rdot"></div><div class="rdot"></div>
      Membaca soal...
    </div>
    <div class="q-text" id="qText">
      <span class="q-num-tag" id="qNumTag">Soal 1</span>
      <span id="qContent"></span>
    </div>
    <div class="options-grid" id="optionsGrid"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-next" id="btnNext" onclick="nextQuestion()">Lanjut ➡️</button>
  </div>
</div>

<!-- ===== PAGE 3: RESULT ===== -->
<div class="page" id="pageResult">
  <div class="card">
    <div class="card-stripe"></div>
    <span class="result-trophy" id="resultTrophy">🏆</span>
    <div class="result-name-display" id="resultName">Nama Siswa</div>
    <div style="text-align:center;font-weight:800;color:#aaa;font-size:0.82rem;margin-bottom:4px;">Hasil Kuis Bilangan Bulat · Kelas 7 SMP</div>
    <div class="result-score-big">
      <div class="score-circle">
        <span class="score-number" id="resultScoreNum">0</span>
        <span class="score-sublabel">Skor</span>
      </div>
      <div>
        <div class="score-slash">/</div>
        <div class="score-of">100</div>
      </div>
    </div>
    <div class="result-detail-card">
      <div class="detail-chip cc">
        <span class="detail-val" id="correctCount">0</span>
        <span class="detail-lbl">✅ Benar</span>
      </div>
      <div class="detail-chip wc">
        <span class="detail-val" id="wrongCount">0</span>
        <span class="detail-lbl">❌ Salah</span>
      </div>
      <div class="detail-chip">
        <span class="detail-val" id="gradeVal">-</span>
        <span class="detail-lbl">🎖️ Nilai</span>
      </div>
    </div>
    <div class="motivation-box" id="motivationBox">Semangat terus ya! 💪</div>
    <button class="btn btn-restart" onclick="restartQuiz()">🔄 Ulangi Kuis</button>
  </div>
</div>

<script>
/* ── Stars ── */
(function(){
  const c = document.getElementById('stars');
  ['⭐','✨','🌟','💫'].forEach((e,ei) => {
    for(let i=0;i<5;i++){
      const s=document.createElement('div');
      s.className='star'; s.textContent=e;
      s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2.5+Math.random()*2}s;font-size:${0.7+Math.random()*1}rem;`;
      c.appendChild(s);
    }
  });
})();

/* ── Questions ── */
const Q = [
  { q:"Suhu di puncak gunung adalah −5°C. Suhu di kaki gunung adalah 20°C. Berapa selisih suhu kedua tempat tersebut?", opts:["15°C","25°C","−15°C","−25°C"], ans:1 },
  { q:"Hasil dari (−8) + 15 + (−3) adalah ...", opts:["−4","4","26","−26"], ans:1 },
  { q:"Sebuah kapal selam berada pada kedalaman −120 meter. Kapal naik 45 meter. Posisi kapal sekarang adalah ...", opts:["−75 m","75 m","−165 m","165 m"], ans:0 },
  { q:"Nilai dari (−6) × (−7) adalah ...", opts:["−42","−13","42","13"], ans:2 },
  { q:"Manakah bilangan bulat yang nilainya paling besar?", opts:["−100","−1","0","−50"], ans:2 },
  { q:"Hasil dari 48 ÷ (−6) adalah ...", opts:["8","−8","−54","54"], ans:1 },
  { q:"Pak Budi memiliki utang Rp30.000 lalu meminjam lagi Rp15.000. Kondisi keuangan Pak Budi adalah ...", opts:["−Rp45.000","Rp45.000","−Rp15.000","Rp15.000"], ans:0 },
  { q:"Lawan bilangan dari −25 adalah ...", opts:["25","−25","0","1/25"], ans:0 },
  { q:"Hasil dari (−3) × 4 + (−2) × (−5) adalah ...", opts:["−22","2","−2","22"], ans:1 },
  { q:"Pada garis bilangan, bilangan yang letaknya paling kiri adalah ...", opts:["0","−5","3","−10"], ans:3 }
];

const MOTIV = [
  { min:90, emoji:"🏆", text:"Luar biasa! Kamu sangat hebat! Teruskan prestasimu ya!" },
  { min:70, emoji:"🌟", text:"Bagus sekali! Hampir sempurna. Sedikit lagi kamu pasti bisa 100!" },
  { min:50, emoji:"💪", text:"Lumayan bagus! Terus semangat belajar, kamu pasti bisa meningkat!" },
  { min:0,  emoji:"📚", text:"Jangan menyerah! Belajar lebih rajin lagi, pasti kamu bisa naik nilai!" }
];

/* ── State ── */
let curQ=0, score=0, corrCnt=0, wrngCnt=0, timerInt=null, timerVal=20, canAnswer=false, studentName='';

/* ── Speech ── */
// Bersihkan simbol matematika agar TTS membacanya dengan benar
function cleanForSpeech(text){
  return text
    .replace(/−/g, 'negatif ')
    .replace(/-(?=\d)/g, 'negatif ')
    .replace(/×/g, ' kali ')
    .replace(/÷/g, ' dibagi ')
    .replace(/\+/g, ' tambah ')
    .replace(/=/g, ' sama dengan ')
    .replace(/°C/g, ' derajat Celsius')
    .replace(/Rp/g, ' Rupiah ')
    .replace(/\.\.\./g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

let preferredVoice = null;

function loadVoices(){
  const voices = window.speechSynthesis.getVoices();
  // Cari suara Bahasa Indonesia dulu
  preferredVoice = voices.find(v => v.lang === 'id-ID') ||
                   voices.find(v => v.lang.startsWith('id')) ||
                   // Fallback ke suara apapun yang tersedia
                   voices.find(v => v.default) ||
                   voices[0] || null;
}

// Load voices saat pertama kali (ada delay di beberapa browser)
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(rawText, cb){
  if(!window.speechSynthesis){ if(cb)cb(); return; }
  // Pastikan cancel dulu agar tidak tumpang tindih
  window.speechSynthesis.cancel();

  const text = cleanForSpeech(rawText);
  const u = new SpeechSynthesisUtterance(text);

  // Terapkan suara terbaik yang tersedia
  if(preferredVoice) u.voice = preferredVoice;

  // Gunakan lang id-ID jika ada, fallback ke id
  u.lang = preferredVoice ? preferredVoice.lang : 'id-ID';
  u.rate   = 0.82;   // sedikit lebih lambat agar jelas
  u.pitch  = 1.0;
  u.volume = 1.0;    // volume maksimum

  if(cb) u.onend = cb;
  u.onerror = function(){ if(cb) cb(); };

  // Workaround bug Chrome: speechSynthesis kadang diam di tengah kalimat panjang
  // Paksa resume setiap 5 detik
  const resumeTimer = setInterval(()=>{
    if(!window.speechSynthesis.speaking){ clearInterval(resumeTimer); return; }
    window.speechSynthesis.pause();
    window.speechSynthesis.resume();
  }, 5000);

  u.onend = function(){
    clearInterval(resumeTimer);
    if(cb) cb();
  };

  window.speechSynthesis.speak(u);
}

/* ── Audio Beep ── */
function beep(type){
  try {
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(type==='correct'){
      [523,659,784].forEach((f,i)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value=f; o.type='sine';
        const t=ctx.currentTime+i*0.13;
        g.gain.setValueAtTime(0.28,t);
        g.gain.exponentialRampToValueAtTime(0.001,t+0.32);
        o.start(t); o.stop(t+0.32);
      });
    } else {
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=180; o.type='sawtooth';
      g.gain.setValueAtTime(0.28,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.45);
      o.start(ctx.currentTime); o.stop(ctx.currentTime+0.45);
    }
  } catch(e){}
}

/* ── Page Transitions ── */
function goTo(fromId, toId){
  const from=document.getElementById(fromId), to=document.getElementById(toId);
  from.classList.add('exit');
  setTimeout(()=>{ from.classList.remove('active','exit'); to.classList.add('active'); }, 370);
}

/* ── Start ── */
function startQuiz(){
  const n=document.getElementById('studentName').value.trim();
  if(!n){
    const inp=document.getElementById('studentName');
    inp.focus();
    inp.style.borderColor='#FF7B7B';
    inp.style.boxShadow='0 0 0 4px rgba(255,123,123,0.22)';
    inp.placeholder='⚠️ Masukkan nama kamu dulu!';
    setTimeout(()=>{ inp.style.borderColor=''; inp.style.boxShadow=''; inp.placeholder='Ketik nama kamu di sini...'; },1800);
    return;
  }
  studentName=n; curQ=0; score=0; corrCnt=0; wrngCnt=0;
  goTo('pageStart','pageQuiz');
  setTimeout(loadQ, 500);
}

/* ── Load Question ── */
function loadQ(){
  const q=Q[curQ];
  canAnswer=false;
  document.getElementById('qCounter').textContent=`Soal ${curQ+1} / 10`;
  document.getElementById('scoreChip').textContent=`⭐ ${score}`;
  document.getElementById('progressFill').style.width=`${(curQ/10)*100}%`;
  document.getElementById('qNumTag').textContent=`Soal ${curQ+1}`;
  document.getElementById('qContent').textContent=q.q;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('readingBox').classList.add('show');

  // Build option buttons (disabled)
  const grid=document.getElementById('optionsGrid');
  grid.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='opt-btn'; b.disabled=true;
    b.innerHTML=`<span>${opt}</span>`;
    b.onclick=()=>answer(i);
    grid.appendChild(b);
  });

  // Read question, then wait 3s, then enable answers
  speak(q.q, ()=>{
    setTimeout(enableAnswers, 3000);
  });
  // Fallback
  setTimeout(()=>{ if(!canAnswer) enableAnswers(); }, 6000);
}

function enableAnswers(){
  document.getElementById('readingBox').classList.remove('show');
  canAnswer=true;
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=false);
  startTimer();
}

/* ── Timer ── */
function startTimer(){
  clearInterval(timerInt);
  timerVal=20;
  updateTimer();
  timerInt=setInterval(()=>{
    timerVal--;
    updateTimer();
    if(timerVal<=0){ clearInterval(timerInt); timeUp(); }
  },1000);
}
function updateTimer(){
  document.getElementById('timerCount').textContent=timerVal;
  document.getElementById('timerFill').style.width=`${(timerVal/20)*100}%`;
  document.getElementById('timerFill').style.background =
    timerVal>10 ? '#6DD47E' : timerVal>5 ? '#F9D835' : '#FF7B7B';
}
function timeUp(){
  if(!canAnswer)return;
  canAnswer=false;
  clearInterval(timerInt);
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  document.querySelectorAll('.opt-btn')[Q[curQ].ans].classList.add('correct');
  wrngCnt++;
  document.getElementById('feedback').textContent='⏰ Waktu habis! Jawaban benar sudah ditandai.';
  document.getElementById('feedback').className='feedback wrong';
  speak('Waktu habis!');
  document.getElementById('btnNext').style.display='block';
}

/* ── Answer ── */
function answer(idx){
  if(!canAnswer)return;
  canAnswer=false;
  clearInterval(timerInt);
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  const correct=Q[curQ].ans;
  const btns=document.querySelectorAll('.opt-btn');
  if(idx===correct){
    btns[idx].classList.add('correct');
    score+=10; corrCnt++;
    document.getElementById('scoreChip').textContent=`⭐ ${score}`;
    document.getElementById('feedback').textContent='✅ Benar! Kamu hebat sekali! +10 poin';
    document.getElementById('feedback').className='feedback correct';
    // Sound after 3s delay
    setTimeout(()=>{ beep('correct'); speak('Betul! Kamu hebat!'); },3000);
  } else {
    btns[idx].classList.add('wrong');
    btns[correct].classList.add('correct');
    wrngCnt++;
    document.getElementById('feedback').textContent='❌ Salah. Lihat jawaban yang benar ya!';
    document.getElementById('feedback').className='feedback wrong';
    setTimeout(()=>{ beep('wrong'); speak('Jawaban salah. Tetap semangat!'); },3000);
  }
  document.getElementById('btnNext').style.display='block';
}

/* ── Next ── */
function nextQuestion(){
  curQ++;
  if(curQ>=Q.length) showResult();
  else loadQ();
}

/* ── Result ── */
function showResult(){
  goTo('pageQuiz','pageResult');
  setTimeout(()=>{
    document.getElementById('resultScoreNum').textContent=score;
    document.getElementById('resultName').textContent=`🎉 ${studentName}`;
    document.getElementById('correctCount').textContent=corrCnt;
    document.getElementById('wrongCount').textContent=wrngCnt;
    let grade=score>=90?'A':score>=80?'B+':score>=70?'B':score>=60?'C+':score>=50?'C':'D';
    document.getElementById('gradeVal').textContent=grade;
    const m=MOTIV.find(x=>score>=x.min);
    document.getElementById('resultTrophy').textContent=m.emoji;
    document.getElementById('motivationBox').textContent=m.text;
    document.getElementById('progressFill').style.width='100%';
    if(score>=70) launchConfetti();
    speak(`Selamat ${studentName}! Kamu mendapat skor ${score} dari 100. ${m.text}`);
  },500);
}

/* ── Restart ── */
function restartQuiz(){
  window.speechSynthesis && window.speechSynthesis.cancel();
  stopConfetti();
  goTo('pageResult','pageStart');
  document.getElementById('studentName').value='';
}

/* ── Confetti ── */
let cfRunning=false, cfFrame;
function launchConfetti(){
  const canvas=document.getElementById('confettiCanvas');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  cfRunning=true;
  const colors=['#7EC8E3','#F9D835','#FFAA77','#6DD47E','#FF7B7B','#4BA3C3','#FFD6B8','#fff'];
  const pieces=Array.from({length:130},()=>({
    x:Math.random()*canvas.width, y:Math.random()*-canvas.height,
    r:4+Math.random()*8, d:1.2+Math.random()*2.5,
    color:colors[Math.floor(Math.random()*colors.length)],
    angle:0, tiltSpd:0.1+Math.random()*0.2
  }));
  (function draw(){
    if(!cfRunning){ ctx.clearRect(0,0,canvas.width,canvas.height); return; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color; ctx.fill();
      p.y+=p.d; p.angle+=p.tiltSpd; p.x+=Math.sin(p.angle)*1.8;
      if(p.y>canvas.height){ p.y=-10; p.x=Math.random()*canvas.width; }
    });
    cfFrame=requestAnimationFrame(draw);
  })();
  setTimeout(stopConfetti,5500);
}
function stopConfetti(){
  cfRunning=false;
  cancelAnimationFrame(cfFrame);
  const c=document.getElementById('confettiCanvas');
  c.getContext('2d').clearRect(0,0,c.width,c.height);
}
</script>
